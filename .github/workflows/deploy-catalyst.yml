name: Deploy to Catalyst

# Every push to main: run the tests, build the image as an OCI tar and deploy it to the
# booking-app AppSail. The AppSail keeps its own environment variables.
# Needs the repository secret CATALYST_TOKEN (from `catalyst token:generate`); without it the
# deploy step is skipped and the image file is still attached to the run.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-catalyst
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: booking_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres@localhost:5432/booking_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          outputs: type=oci,dest=booking-app.tar
      - uses: actions/upload-artifact@v4
        with:
          name: booking-app-${{ github.sha }}
          path: booking-app.tar
          retention-days: 14
          compression-level: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy to Catalyst AppSail
        id: deploy
        env:
          CATALYST_TOKEN: ${{ secrets.CATALYST_TOKEN }}
        run: |
          if [ -z "$CATALYST_TOKEN" ]; then
            echo "CATALYST_TOKEN is not set; skipping deploy."
            exit 0
          fi
          npm i -g zcatalyst-cli@1.28.0
          catalyst deploy appsail --name booking-app \
            --source "docker-archive://$PWD/booking-app.tar" --port 9000 \
            -p 73492000000013052 --dc in --token "$CATALYST_TOKEN" -ni --verbose 2>&1 | tee deploy.log || true
          if ! grep -q "Deploy completed successfully" deploy.log; then
            # Annotations can be read without signing in, so the reason shows on the run page and in the API.
            reason=$(sed 's/\x1b\[[0-9;]*m//g' deploy.log | grep -v '^\s*$' | tail -n 20 | tr '\n' ' ' | cut -c1-1500)
            echo "::error title=Catalyst deploy failed::$reason"
            exit 1
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
      - name: Check the live app
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          for i in 1 2 3 4 5 6 7 8; do
            if curl -fsS -m 60 https://booking-app-50046547819.development.catalystappsail.in/api/v1/health; then exit 0; fi
            sleep 15
          done
          echo "Live app health check failed"; exit 1
